name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js

      - name: Validate JSON
        run: |
          node -e "['package.json','version.json','locale/en.json','locale/zh.json'].forEach(f => JSON.parse(require('fs').readFileSync(f,'utf8'))); console.log('json ok')"

      - name: Version consistency (package.json / version.json / client.js)
        run: |
          node -e "
            const p = require('./package.json');
            const v = require('./version.json');
            const src = require('fs').readFileSync('client.js', 'utf8');
            const m = src.match(/PLUGIN_VERSION\s*=\s*'([^']+)'/);
            if (!m) throw new Error('PLUGIN_VERSION not found in client.js');
            if (p.version !== v.version || m[1] !== p.version) {
              throw new Error('version mismatch: package.json=' + p.version + ', version.json=' + v.version + ', client.js=' + m[1]);
            }
            console.log('versions consistent:', p.version);
          "

      - name: Manifest contract
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) throw new Error('dsh.bundle.patch missing');
            if (!p.dsh.client || !Array.isArray(p.dsh.client.inject)) throw new Error('dsh.client.inject missing');
            if (!p.engines || !p.engines.dsh) throw new Error('engines.dsh missing');
            const fs = require('fs');
            if (!fs.existsSync(p.dsh.bundle.patch)) throw new Error('bundle patch file not found');
            console.log('manifest ok');
          "
